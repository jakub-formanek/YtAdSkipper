<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>YT Ad Skipper</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 14px 16px; min-width: 220px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 6px; }
    label.small { font-size: 12px; color: #555; }
    input { width: 16px; height: 16px; }
    .stat { margin-top: 12px; color: #555; }
    .stat b { color: #000; }
    button { margin-top: 10px; font-size: 12px; }
    .ver { margin-top: 10px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <h1>YT Ad Skipper</h1>
  <label><input type="checkbox" id="enabled"> Přeskakovat reklamy</label>
  <label class="small"><input type="checkbox" id="debug"> Ladicí výpis do konzole</label>
  <div class="stat">Přeskočeno reklam: <b id="count">0</b></div>
  <button id="reset">Vynulovat počítadlo</button>
  <div class="ver" id="ver"></div>
  <script src="popup.js"></script>
</body>
</html>
